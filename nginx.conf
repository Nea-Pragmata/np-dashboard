server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SvelteKit's hashed build assets are content-addressed and immutable.
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves the app shell so client-side
    # routing and deep links (e.g. /np-admin/bedrifter) resolve in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
